<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Patch — pixel-art robot developer mascot">
  <rect width="128" height="128" fill="#0B0D10"/>
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 -5; 0 0" dur="2.6s" repeatCount="indefinite"/>
    <!-- antenna -->
    <rect x="60" y="16" width="8" height="14" fill="#5A74D8"/>
    <rect x="55" y="8" width="18" height="10" fill="#70D6A1"/>
    <!-- head -->
    <rect x="36" y="32" width="56" height="28" fill="#7897FF"/>
    <rect x="44" y="40" width="40" height="15" fill="#0B0D10"/>
    <rect x="50" y="45" width="8" height="6" fill="#70D6A1"/>
    <rect x="72" y="45" width="8" height="6" fill="#70D6A1"/>
    <!-- arms -->
    <rect x="20" y="66" width="10" height="22" fill="#7897FF"/>
    <rect x="98" y="66" width="10" height="22" fill="#7897FF"/>
    <!-- body -->
    <rect x="32" y="62" width="64" height="26" fill="#5A74D8"/>
    <rect x="46" y="69" width="36" height="11" fill="#0B0D10"/>
    <rect x="52" y="73" width="5" height="4" fill="#70D6A1"/>
    <rect x="63" y="73" width="5" height="4" fill="#7897FF"/>
    <rect x="73" y="73" width="5" height="4" fill="#39404F"/>
    <!-- laptop -->
    <rect x="38" y="82" width="52" height="18" fill="#101F18" stroke="#70D6A1" stroke-width="1.6"/>
    <rect x="43" y="87" width="17" height="3" fill="#70D6A1"/>
    <rect x="43" y="93" width="24" height="3" fill="#2E4580"/>
    <rect x="24" y="100" width="80" height="7" fill="#232B38"/>
    <rect x="53" y="102" width="22" height="2" fill="#39404F"/>
    <!-- legs -->
    <rect x="42" y="107" width="13" height="8" fill="#39404F"/>
    <rect x="73" y="107" width="13" height="8" fill="#39404F"/>
  </g>
  <rect x="18" y="120" width="92" height="3" fill="#10141B"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" role="img" aria-label="Shreekrishna Chinta — Full-stack Developer and AI &amp; Data Science undergrad">
  <defs>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M 44 0 H 0 V 44" fill="none" stroke="#141922" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7897FF"/>
      <stop offset="1" stop-color="#7897FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7897FF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#7897FF" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#7897FF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="880" height="300" fill="#0B0D10"/>
  <rect width="880" height="300" fill="url(#grid)"/>

  <!-- corner marks -->
  <g stroke="#232B38" stroke-width="2" fill="none">
    <path d="M 22 34 V 22 H 34"/>
    <path d="M 858 34 V 22 H 846"/>
    <path d="M 22 266 V 278 H 34"/>
    <path d="M 858 266 V 278 H 846"/>
  </g>

  <!-- coordinates, faint -->
  <text x="836" y="284" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" fill="#39404F" text-anchor="end">18.52°N 73.85°E · PUNE</text>

  <!-- kicker -->
  <text x="42" y="72" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#7897FF">// ~/profile — shreekrishna@github</text>

  <!-- wordmark -->
  <text x="40" y="142" font-family="'Space Grotesk', 'Arial Black', sans-serif" font-weight="800" font-size="62" letter-spacing="1" fill="#E8EAED">SHREEKRISHNA<tspan fill="#7897FF"> CHINTA</tspan></text>

  <!-- role -->
  <text x="42" y="180" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14.5" fill="#A1A1AA">full-stack developer · ai &amp; data science undergrad</text>

  <!-- tagline -->
  <text x="42" y="224" font-family="'Space Grotesk', Inter, sans-serif" font-weight="600" font-size="21" fill="#E8EAED">shipping intelligent products<tspan fill="#70D6A1">.</tspan></text>
  <rect x="418" y="206" width="11" height="20" fill="#70D6A1">
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.45;0.5;0.95;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>

  <!-- travelling dot along bottom grid line -->
  <circle r="9" fill="url(#glow)" opacity="0.85">
    <animateMotion dur="8s" repeatCount="indefinite" path="M -16 248 H 896"/>
  </circle>
  <circle r="3" fill="#7897FF">
    <animateMotion dur="8s" repeatCount="indefinite" path="M -16 248 H 896"/>
  </circle>

  <!-- one-time scanline on load -->
  <rect x="-160" y="0" width="160" height="300" fill="url(#scan)">
    <animate attributeName="x" from="-160" to="1020" dur="1.4s" begin="0.2s" fill="freeze"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.8;1" dur="1.4s" begin="0.2s" fill="freeze"/>
  </rect>
</svg>

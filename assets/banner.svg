<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" role="img" aria-label="Shreekrishna — Full-stack AI Engineer">
  <defs>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 H 0 V 60" fill="none" stroke="#232423" stroke-width="1"/>
    </pattern>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E87536" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#E87536" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#E87536" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#E87536"/>
      <stop offset="1" stop-color="#E87536" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="400" fill="#171817"/>
  <rect width="1200" height="400" fill="url(#grid)"/>

  <!-- corner marks -->
  <g stroke="#3a3b39" stroke-width="2">
    <path d="M 28 44 V 28 H 44"/>
    <path d="M 1172 44 V 28 H 1156"/>
    <path d="M 28 356 V 372 H 44"/>
    <path d="M 1172 356 V 372 H 1156"/>
  </g>

  <!-- kicker -->
  <text x="64" y="86" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="17" letter-spacing="4" fill="#E87536">// FULL-STACK AI ENGINEER</text>

  <!-- wordmark -->
  <text x="60" y="196" font-family="'Space Grotesk', 'Arial Black', sans-serif" font-weight="800" font-size="96" letter-spacing="2" fill="#e8e3da">SHREEKRISHNA<tspan fill="#E87536" font-size="40" dy="-38">®</tspan></text>

  <!-- tagline with blinking cursor -->
  <text x="64" y="262" font-family="'Space Grotesk', 'Arial Black', sans-serif" font-weight="700" font-size="34" letter-spacing="6" fill="#e8e3da">ENGINEERING INTELLIGENCE<tspan fill="#E87536">.</tspan></text>
  <rect x="726" y="232" width="16" height="32" fill="#E87536">
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.45;0.5;0.95;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>

  <!-- subline -->
  <text x="64" y="330" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="16" fill="#8b8b85">AI &amp; Data Science @ AISSMS IOIT · Pune · open to collab</text>

  <!-- travelling orange dot along a grid line -->
  <circle r="10" fill="url(#glow)" opacity="0.9">
    <animateMotion dur="7s" repeatCount="indefinite" path="M -20 374 H 1220"/>
  </circle>
  <circle r="3.5" fill="#E87536">
    <animateMotion dur="7s" repeatCount="indefinite" path="M -20 374 H 1220"/>
  </circle>

  <!-- one-time scanline sweep on load -->
  <rect x="-180" y="0" width="180" height="400" fill="url(#scan)">
    <animate attributeName="x" from="-180" to="1400" dur="1.5s" begin="0.2s" fill="freeze"/>
    <animate attributeName="opacity" values="0;0.6;0.6;0" keyTimes="0;0.1;0.8;1" dur="1.5s" begin="0.2s" fill="freeze"/>
  </rect>
</svg>

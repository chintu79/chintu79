name: Update profile art

# Refreshes the contribution graph + stats card SVGs daily from real data.
# Runs daily, on push to main, and on-demand. No secrets required —
# contributions come from GitHub's public HTML fragment, stats from public REST.

"on":
  schedule:
    - cron: "23 5 * * *"   # ~05:23 UTC every day
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Scrape public contribution data
        run: python scripts/fetch_contributions.py

      - name: Render contribution graph SVG
        run: python scripts/render_heatmap_svg.py

      - name: Render stats card SVG
        run: python scripts/render_stats_svg.py

      - name: Commit updated art
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh contribution art [skip ci]"
          file_pattern: "data/contributions.json assets/contrib-heatmap.svg assets/stats.svg"
